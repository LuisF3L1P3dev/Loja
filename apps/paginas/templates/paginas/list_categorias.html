{% extends "paginas/base_paginas.html" %}
{% load static %}

{% block content %}
<button type="button"><a href=" {% url "index" %}">Voltar</a></button>
<h1>Produtos</h1>
<ul>
  
  <table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nome</th>
      <th scope="col">Produtos</th>
    </tr>
  </thead>
  <tbody>
  {% for categoria in categorias %}   
    <tr>
      <th scope="row"> {{ categoria.id }}</th>
      <td>{{ categoria.nome }}</td>
      <td>{{ categoria.produtos.id }}</td>
    </tr> 
  {% endfor %}

  </tbody>
</table>

</ul>
{% endblock %}
